name: Deploy WordPress via Helm

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/achal/.kube/config

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify kubectl access
        run: kubectl get nodes

      - name: Add Helm repo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Helm upgrade WordPress
        run: |
          RELEASE=$(cat helm-release-name.txt)
          NAMESPACE=$(cat namespace.txt)
          helm upgrade $RELEASE bitnami/wordpress \
              -n $NAMESPACE \
              -f values.yaml
